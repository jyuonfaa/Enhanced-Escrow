name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Run every 14 minutes
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret is not set. Skipping ping."
            exit 0
          fi
          echo "Pinging backend at ${{ secrets.RENDER_URL }}..."
          curl -f "${{ secrets.RENDER_URL }}/api/health-db"
